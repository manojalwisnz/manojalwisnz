<svg width="480" height="300" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="480" height="300" rx="12"/>
    </clipPath>
  </defs>

  <!-- Main background -->
  <rect width="480" height="300" rx="12" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.6" fill="#21262d" opacity="0.8"/>
  </pattern>
  <rect width="480" height="300" rx="12" fill="url(#grid)" opacity="0.6"/>

  <!-- Animated border glow -->
  <rect width="480" height="300" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal header bar -->
  <rect x="0" y="0" width="480" height="38" rx="12" fill="url(#headerGrad)" clip-path="url(#rounded)"/>
  <rect x="0" y="20" width="480" height="18" fill="url(#headerGrad)"/>

  <!-- Window control dots -->
  <circle cx="20" cy="19" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="19" r="5.5" fill="#28c940"/>

  <!-- Terminal title -->
  <text x="240" y="24" font-family="'JetBrains Mono', 'Menlo', 'Monaco', monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">&#x1F510; GitHubMate &#x2014; Security Scanner</text>

  <!-- Header separator -->
  <line x1="0" y1="38" x2="480" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Animated scan line -->
  <rect x="0" y="38" width="480" height="2" fill="#00ff88" opacity="0">
    <animate attributeName="y" values="38;290;38" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;0.15;0;0.15;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- === CONTENT === -->

  <!-- Prompt line -->
  <text x="20" y="62" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="11" fill="#00ff88" filter="url(#textGlow)">$</text>
  <text x="32" y="62" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="11" fill="#c9d1d9"> scanner --full-scan --repo any/repo</text>
  <!-- Blinking cursor -->
  <rect x="330" y="52" width="7" height="12" fill="#00ff88" filter="url(#textGlow)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" keyTimes="0;0.5;0.5;1"/>
  </rect>

  <!-- Status indicator -->
  <circle cx="20" cy="78" r="4" fill="#00ff88" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;5.5;4" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="82" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#00ff88">LIVE</text>
  <text x="58" y="82" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#484f58"> &#x00B7;&#x00B7;&#x00B7; no backend &#x00B7; browser-only &#x00B7; no signup</text>

  <!-- Divider -->
  <line x1="20" y1="95" x2="460" y2="95" stroke="#21262d" stroke-width="1"/>

  <!-- ── Row 1: OWASP LLM Top 10 ── -->
  <text x="20" y="116" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#8b949e">OWASP LLM Top 10</text>
  <rect x="178" y="106" width="204" height="9" rx="4.5" fill="#21262d"/>
  <rect x="178" y="106" width="0" height="9" rx="4.5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="204" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
  </rect>
  <text x="390" y="116" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#00ff88" filter="url(#textGlow)">10&#x2F;10</text>

  <!-- ── Row 2: OWASP Top 10 ── -->
  <text x="20" y="136" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#8b949e">OWASP Top 10    </text>
  <rect x="178" y="126" width="204" height="9" rx="4.5" fill="#21262d"/>
  <rect x="178" y="126" width="0" height="9" rx="4.5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="204" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
  </rect>
  <text x="390" y="136" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#00ff88" filter="url(#textGlow)">10&#x2F;10</text>

  <!-- ── Row 3: Secret Patterns ── -->
  <text x="20" y="156" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#8b949e">Secret Patterns  </text>
  <rect x="178" y="146" width="204" height="9" rx="4.5" fill="#21262d"/>
  <rect x="178" y="146" width="0" height="9" rx="4.5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="184" dur="1.2s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
  </rect>
  <text x="390" y="156" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#00d4ff">30+</text>

  <!-- ── Row 4: SAST Patterns ── -->
  <text x="20" y="176" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#8b949e">SAST Patterns    </text>
  <rect x="178" y="166" width="204" height="9" rx="4.5" fill="#21262d"/>
  <rect x="178" y="166" width="0" height="9" rx="4.5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="194" dur="1.2s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
  </rect>
  <text x="390" y="176" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#00d4ff">123+</text>

  <!-- ── Row 5: Compliance ── -->
  <text x="20" y="196" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#8b949e">Compliance Checks</text>
  <rect x="178" y="186" width="204" height="9" rx="4.5" fill="#21262d"/>
  <rect x="178" y="186" width="0" height="9" rx="4.5" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="170" dur="1.2s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
  </rect>
  <text x="390" y="196" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#00d4ff">SOC2&#x2B;3</text>

  <!-- Divider -->
  <line x1="20" y1="210" x2="460" y2="210" stroke="#21262d" stroke-width="1"/>

  <!-- Output line -->
  <text x="20" y="228" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#3fb950" filter="url(#textGlow)">&#x2713; Scan complete</text>
  <text x="116" y="228" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#484f58"> &#x00B7; Attack Surface Map &#x00B7; SBOM exported</text>

  <!-- Tag badges -->
  <rect x="20" y="240" width="44" height="18" rx="4" fill="#0d4a26"/>
  <text x="42" y="253" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#00ff88" text-anchor="middle" font-weight="bold">FREE</text>

  <rect x="70" y="240" width="88" height="18" rx="4" fill="#0a2a4a"/>
  <text x="114" y="253" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#00d4ff" text-anchor="middle">NO BACKEND</text>

  <rect x="164" y="240" width="80" height="18" rx="4" fill="#2d1f4a"/>
  <text x="204" y="253" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="9" fill="#a371f7" text-anchor="middle">NO SIGNUP</text>

  <!-- URL CTA -->
  <text x="456" y="253" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="10" fill="#00ff88" text-anchor="end" filter="url(#textGlow)">githubmate.ai &#x2192;</text>

  <!-- Footer -->
  <line x1="20" y1="268" x2="460" y2="268" stroke="#21262d" stroke-width="0.8"/>
  <text x="20" y="284" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="8.5" fill="#30363d">manojalwisnz &#x00B7; New Zealand &#x1F1F3;&#x1F1FF; &#x00B7; Mobile &#x2F; AI Engineer &#x00B7; Open Source</text>
</svg>
