name: Update Profile Metrics

on:
  schedule:
    # Runs every 6 hours — keeps stats fresh without hammering APIs
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Job 1: Generate rich metrics SVG via lowlighter/metrics ──────────────
  generate-metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Full stats card: header + activity + repos + languages
      - name: Metrics — Base Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.base.svg
          base: header, activity, community, repositories
          base_indepth: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30
          config_timezone: Pacific/Auckland
          config_display: large
          config_padding: 10
          config_animations: yes
          # Dark theme matching dashboard.svg
          config_base: default
          repositories_skipped: >-
            @use.patterns
            **/.github
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "ci: update metrics [skip ci]"

      # Language breakdown card (compact layout)
      - name: Metrics — Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 30
          config_timezone: Pacific/Auckland
          config_animations: yes
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "ci: update language metrics [skip ci]"

      # Recent activity feed
      - name: Metrics — Recent Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 14
          plugin_activity_filter: push, pr, issue, release
          config_timezone: Pacific/Auckland
          config_animations: yes
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "ci: update activity metrics [skip ci]"

  # ── Job 2: Update README with dynamic "last updated" timestamp ──────────
  update-readme-timestamp:
    name: Timestamp README
    runs-on: ubuntu-latest
    needs: generate-metrics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update last-scanned timestamp in README
        run: |
          TIMESTAMP=$(TZ="Pacific/Auckland" date '+%Y-%m-%d %H:%M NZST')
          # Replace the placeholder line if it exists, otherwise append
          if grep -q "<!-- LAST_UPDATED -->" README.md; then
            sed -i "s|<!-- LAST_UPDATED -->.*|<!-- LAST_UPDATED --> _Metrics refreshed: ${TIMESTAMP}_|g" README.md
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "ci: refresh profile metrics $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git push
